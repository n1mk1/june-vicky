<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 769 248" width="769" height="248">
  <title>VICKY</title>
  <!-- Cap height 142, stroke ~27, "/" knife cuts matching the JUNE wordmark -->
  <g fill="#fff" transform="translate(46 52)">
    <!-- V -->
    <polygon points="0,0 30,0 62,94.7 94,0 124,0 76,142 48,142"/>
    <!-- I: knife-cut top, like the J -->
    <polygon transform="translate(158 0)" points="27,0 27,142 0,142 0,33"/>
    <!-- C -->
    <path transform="translate(221 0)" d="M128.4,29.3 A71,71 0 1,0 128.4,112.7 L85,112.7 A44,44 0 1,1 85,29.3 Z"/>
    <!-- K: leg sliced off by a "/" gap, like the E -->
    <g transform="translate(385 0)">
      <rect x="0" y="0" width="27" height="142"/>
      <polygon points="86,0 124,0 27,98.7 27,60"/>
      <polygon points="58.3,81.1 77.5,61.6 137.8,142 104,142"/>
    </g>
    <!-- Y: knife-cut stem foot, like the N -->
    <polygon transform="translate(553 0)" points="0,0 32,0 62,45.8 92,0 124,0 75.5,74 75.5,112 52,142 48.5,142 48.5,74"/>
  </g>
</svg>
