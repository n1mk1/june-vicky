[project]
name = "vik"
version = "0.1.0"
description = "Vik, the AI venture capitalist: metrics engine, truth layer, investor panel and pitch simulator"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.143,<1",
  "uvicorn[standard]>=0.54",
  "asyncpg>=0.32",
  "redis>=5.2,<6",  # arq 0.28 pins redis < 6
  "arq>=0.28",
  "pandas>=3.0",
  "openpyxl>=3.1",
  "pypdf>=6.21",
  "python-docx>=1.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.16",
  "pyyaml>=6.0",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.32",
  "ag-ui-protocol>=1.0",
  "httpx>=0.28",
  "pytesseract>=0.3.13",
  "pypdfium2>=4.30",
  "pillow>=11",
  "python-pptx>=1.0",
  "google-genai>=2.31,<3",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vik"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: needs Postgres and Redis (docker compose up db kv)"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "ASYNC240", "ASYNC230"]
