# Calibration targets: every metric result Appendix H (with D and I) states for this case.
# value null = the pack gives no number. csv_check = the same formula run by hand on
# income_statement_monthly.csv (or on the pack inputs named), for the metrics engine tests.
targets:
  - metric: mrr
    value: 107189
    unit: cad
    tolerance: 0
    period: "2026-09"
    stated: "$107,189 in September 2026"
    definition: "Subscription revenue in the month, excluding one-time onboarding fees. Latest closed month (Sep 2026)."
    csv_check: {value: 107189, arithmetic: "subscription_revenue[2026-09]"}
    ref: "Appendix B, p.6; Appendix H, p.31; Appendix I, p.35"
  - metric: arr
    value: 1286268
    unit: cad
    tolerance: 5000
    period: "2026-09"
    stated: "$1.29M. That's September MRR of $107,189 times 12. We leave out onboarding fees"
    definition: "MRR x 12, latest month: Sep 2026 subscription revenue x 12. Onboarding fees excluded (they were $108,600 over the last 12 months)."
    csv_check: {value: 1286268, arithmetic: "107189 x 12"}
    note: "Pack rounds to $1.29M. The deck's $1.37M is Sep total revenue x 12 (114,389 x 12 = 1,372,668), which includes $7,200 of onboarding fees."
    ref: "Appendix D q1, p.16; Appendix H, p.32; Appendix I, p.34"
  - metric: net_new_arr_l12m
    value: 830076
    unit: cad
    tolerance: 5000
    period: L12M
    stated: "$830K over the last 12 months"
    definition: "ARR at the end of the period minus ARR at the start: (MRR Sep 2026 - MRR Sep 2025) x 12."
    csv_check: {value: 830076, arithmetic: "(107189 - 38016) x 12"}
    ref: "Appendix H, p.31; Appendix I, p.36"
  - metric: cmgr_12m
    value: 0.09
    unit: pct
    tolerance: 0.005
    period: "2025-09..2026-09"
    stated: "MRR went from $38K to $107K in the 12 months to September, about 9% a month compounded"
    definition: "Compound monthly growth of MRR over 12 monthly steps: (MRR Sep 2026 / MRR Sep 2025)^(1/12) - 1. Start = Sep 2025 month-end MRR, end = Sep 2026."
    csv_check: {value: 0.0902, arithmetic: "(107189 / 38016)^(1/12) - 1"}
    ref: "Appendix D q2, p.16; Appendix H, pp.31-32; Appendix I, p.34"
  - metric: cmgr_12m_ex_top_customer
    value: 0.08
    unit: pct
    tolerance: 0.005
    period: "2025-09..2026-09"
    stated: "About $10K of that is one customer ... Without them it's about 8%"
    definition: "Same as cmgr_12m with the largest customer's MRR (signed March 2026, so absent at the start) removed from the end value."
    csv_check: {value: 0.0810, arithmetic: "((107189 - 10400) / 38016)^(1/12) - 1, using 260 seats x $40 (Appendix A p.4)"}
    ref: "Appendix D q2, p.16"
  - metric: cmgr_recent
    value: 0.05
    unit: pct
    tolerance: 0.005
    period: "2026-06..2026-09"
    stated: "Growth slowed to about 5% a month from July to September (D q2). MRR $92,813 in June to $107,189 in September (H p.31)."
    definition: "Compound monthly growth over the last 3 monthly steps (July, August, September 2026): (MRR Sep 2026 / MRR Jun 2026)^(1/3) - 1. Start = June month-end MRR."
    csv_check: {value: 0.0492, arithmetic: "(107189 / 92813)^(1/3) - 1"}
    ref: "Appendix D q2, p.16; Appendix H, pp.31-32"
  - metric: gross_margin
    value: 0.92
    unit: pct
    tolerance: 0.005
    period: "2026-09"
    stated: "92% if you only count hosting, SMS and card fees (D q5). 92% as booked (I p.35)."
    definition: "As booked: (total revenue - cost of revenue) / total revenue, where cost of revenue = hosting + SMS and telephony + card processing, and total revenue includes onboarding fees. Customer success is excluded (it sits in opex)."
    csv_check: {value: 0.9239, arithmetic: "gross_profit / total_revenue, Sep 2026 = 105685 / 114389"}
    note: "The pack does not state the window for the 92%. Latest month = 92.4%, L12M pooled = 91.7%; both round to 92%."
    ref: "Appendix D q5, p.17; Appendix H, p.32; Appendix I, p.35"
  - metric: gross_margin_incl_cs
    value: null
    unit: pct
    tolerance: 0.005
    period: "2026-09"
    stated: "Our three customer success staff cost $17,000 a month against $114,000 of September revenue."
    definition: "(gross profit - customer success salaries) / total revenue, latest month (Sep 2026)."
    csv_check: {value: 0.7753, arithmetic: "(105685 - 17000) / 114389"}
    note: "The pack states the inputs for September but no latest-month percentage; its only incl-support figure is the L12M 74%."
    ref: "Appendix D q5, p.17"
  - metric: gross_margin_incl_cs_l12m
    value: 0.74
    unit: pct
    tolerance: 0.005
    period: "2025-10..2026-09"
    stated: "on that basis it's 74% over the last 12 months (D q5). Including them, the last 12 months were 74% (H p.32)."
    definition: "Pooled over Oct 2025..Sep 2026: (sum gross profit - sum customer success salaries) / sum total revenue (incl. onboarding)."
    csv_check: {value: 0.7430, arithmetic: "(sum gross_profit - sum customer_success_salaries) / sum total_revenue, last 12 rows = (918,373 - 174,000) / 1,001,816"}
    note: "Average of monthly ratios gives 0.734, also 74%. A subscription-only denominator gives 0.712 and does NOT match, so the denominator is total revenue."
    ref: "Appendix D q5, p.17; Appendix H, p.32; Appendix I, p.35"
  - metric: burn
    value: 58000
    unit: cad
    tolerance: 1000
    period: "2026-04..2026-09"
    stated: "About $58K a month, April to September 2026, excluding the SR&ED refund"
    definition: "Average monthly net loss excluding SR&ED other income over the last 6 closed months (Apr..Sep 2026) = average of -operating_income."
    csv_check: {value: 58421, arithmetic: "-(sum operating_income Apr..Sep 2026) / 6 = 350,526 / 6"}
    note: "Including the July $182,300 credit the 6-month average would be $28,038; the audit (p.33) says runway must exclude it. Cash basis for Q2+Q3 2026 ex SR&ED is also ~$58K."
    ref: "Appendix I, p.34; Appendix D q11, p.19; Appendix H, p.33"
  - metric: runway_months
    value: 8
    unit: months
    tolerance: 0.5
    period: "2026-09"
    stated: "We have $483K and have been burning about $58K a month, so about 8 months"
    definition: "Cash at Sep 30 2026 ($483,270) / burn (average monthly burn ex SR&ED, Apr..Sep 2026)."
    csv_check: {value: 8.27, arithmetic: "483270 / 58421"}
    ref: "Appendix A, p.3; Appendix D q11, p.19; Appendix I, p.36"
  - metric: burn_multiple
    value: 0.6
    unit: x
    tolerance: 0.05
    period: L12M
    stated: "Net new ARR of $830K in the last 12 months against net burn of $514K, a burn multiple of about 0.6"
    definition: "Net burn / net new ARR over Oct 2025..Sep 2026. Net burn is CASH-BASED: fall in cash excluding SAFE financing ($514K = 497K - 483K + 500K), so it includes the $182,300 SR&ED refund and annual-prepayment cash. Net new ARR = (Sep 2026 MRR - Sep 2025 MRR) x 12."
    csv_check: {value: 0.619, arithmetic: "514000 / 830076 (net burn from fact net_burn_l12m)"}
    note: "Not computable from the income statement alone. Using the P&L net loss instead gives 656,262 / 830,076 = 0.79, which does NOT match."
    ref: "Appendix H, p.31; Appendix I, p.34; Appendix F, p.26 (Sacks)"
  - metric: burn_multiple_ex_credits
    value: 0.8
    unit: x
    tolerance: 0.05
    period: L12M
    stated: "Without the SR&ED refund it is about 0.8"
    definition: "(Cash-based net burn L12M + SR&ED refund received in the window) / net new ARR = (514K + 182.3K) / 830K."
    csv_check: {value: 0.839, arithmetic: "(514000 + 182300) / 830076"}
    note: "Using P&L operating loss L12M instead gives 838,562 / 830,076 = 1.01, which does NOT match."
    ref: "Appendix H, p.31; Appendix I, p.34"
  - metric: cac
    value: 3200
    unit: cad
    tolerance: 50
    period: L12M
    stated: "Fully loaded, about $3,200 per customer. That's $491,000 of sales and marketing salaries, commissions and programs over 153 new customers in the last 12 months."
    definition: "Fully loaded, last 12 months (Oct 2025..Sep 2026): (sales salaries + sales commissions + marketing salaries + marketing programs) / new customers won in the same 12 months."
    csv_check: {value: 3209, arithmetic: "490,982 / 153 (168,000 + 84,782 + 90,000 + 148,200; 153 = 33+38+42+40)"}
    note: "Window is 12 months, not 6. The deck's $970 is marketing programs only: 148,200 / 153 = $969."
    ref: "Appendix D q6, p.17; Appendix H, p.32; Appendix I, p.34"
  - metric: cac_payback_months
    value: 9.5
    unit: months
    tolerance: 0.5
    period: L12M
    stated: "A new customer brings about $458 of MRR, so payback is about 9 to 10 months on a margin that includes support."
    definition: "CAC / (MRR per NEW customer x gross margin including customer success). Pack inputs: CAC $3,200 (or $3,209), new-customer MRR $458, margin incl. support (74% L12M)."
    csv_check: {value: 9.47, arithmetic: "3209 / (458 x 0.743); with the Sep-only margin 0.775 it is 9.04"}
    note: "Target range 9-10. Average MRR per ACTIVE customer ($508) gives 8.5 and falls outside the range, so the engine needs new-customer MRR (fact new_customer_mrr_avg)."
    ref: "Appendix D q6, p.17; Appendix H, p.32; Appendix I, p.34"
  - metric: logo_churn_rate
    value: 0.020
    unit: pct
    tolerance: 0.002
    period: L12M
    stated: "We lost 2.0% of customers a month over the last 12 months, about a fifth of the base a year."
    definition: "Monthly logo churn averaged over Oct 2025..Sep 2026: customers who cancelled / customers at the start of each month."
    csv_check: {value: null, arithmetic: "Not in the CSV. Quarterly counts give 35 churned / 12 months over an average opening base of ~144-146 = ~2.0%."}
    note: "The exact monthly denominators live in 04_mrr_bridge (not in repo). The engine's latest-period-only formula would not reproduce this."
    ref: "Appendix D q3, p.17; Appendix H, p.31; Appendix I, p.34"
  - metric: logo_churn_rate_6m
    value: 0.016
    unit: pct
    tolerance: 0.002
    period: "2026-04..2026-09"
    stated: "The last six months were better, at 1.6%."
