# Pack facts for the Tidewell sample: figures the monthly income-statement CSV cannot provide.
# Every value is transcribed from the Catalyst Team 18 supporting pack
# (docs/challenge/ai-pitch-coach-supporting-resources-pages-1-37-1-1-d957a537.pdf).
# Refs use absolute PDF page numbers (Appendix A = pp.3-5, B = 6-10, C = 11-15, D = 16-20,
# E = 21-24, F = 25-27, G = 28-30, H = 31-33, I = 34-37), matching profile.yaml.
#
# Conventions
#   - Money in CAD (pack p.2). Percentages as fractions (0.016 = 1.6%).
#   - Values from the pack's "$000s" tables are multiplied out (47 -> 47000) and carry
#     a note that they are rounded to the nearest $1,000.
#   - kind: historical = closed months (Oct 2024..Sep 2026); forecast = founders' plan
#     (Appendix C) or a projection; founder_claim = the founders' own unverified words.
#   - Forecast facts use a `plan.` prefix so they never collide with a historical metric
#     (facts_by_metric keeps the latest period per name, and a 2028 plan cash balance
#     must not replace the Sep 2026 actual).
#   - target_metric: true marks facts whose value IS a pack-stated result for a metric
#     the engine reports (nrr, grr, cac, ...). They fill gaps the CSV cannot (no cohort,
#     customer or cash tables) and double as calibration targets.
#   - Where the pack gives a range ("about 9 to 10 months") the midpoint is recorded
#     with value_low/value_high and a note. The loader ignores extra keys.
#   - Data files 02-10 named in the pack (pp.10, 15) are NOT in this repo, and
#     Appendix J (test scenarios, listed on p.2) is not in the 37-page PDF.

