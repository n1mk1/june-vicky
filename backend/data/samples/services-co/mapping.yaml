# Synthetic fixture - generated by backend/scripts/make_fixtures.py. Do not edit by hand.
# Fictional company; any resemblance to a real business is coincidental.
dataset: "projects_monthly.csv"
layout: "long"
transpose: false
period_format: "Mon YYYY"
mappings:
  - source_column: "Month"
    canonical_field: "period"
    unit: "month"
    confidence: 0.95
    note: "one row per month"
  - source_column: "Project revenue"
    canonical_field: "revenue.total"
    unit: "gbp"
    confidence: 0.95
    note: "all revenue is one-off project fees; there is no recurring revenue, so the SaaS metric set stays off"
  - source_column: "Contractor costs"
    canonical_field: "cogs"
    unit: "gbp"
    confidence: 0.95
    note: "freelancers billed directly to client projects (direct cost of delivery)"
  - source_column: "Salaries"
    canonical_field: "opex.other"
    unit: "gbp"
    confidence: 0.95
    note: "opex category; staff split across delivery and admin, not separable"
  - source_column: "Rent & overheads"
    canonical_field: "opex.g_and_a"
    unit: "gbp"
    confidence: 0.95
    note: "opex category"
  - source_column: "Net profit"
    canonical_field: "net_income"
    unit: "gbp"
    confidence: 0.95
    note: "= Project revenue - Contractor costs - Salaries - Rent & overheads (pre-tax)"
  - source_column: "Bank balance"
    canonical_field: "cash_balance"
    unit: "gbp"
    confidence: 0.95
    note: "month-end balance; also moves by quarterly director dividends (not a P&L row)"
absent_fields:
  - "revenue.recurring"
  - "revenue.one_time"
  - "gross_profit"
  - "opex.total"
  - "operating_income"
  - "non_dilutive_income"
  - "customers.count"
  - "customers.new"
  - "customers.churned"
  - "headcount.total"
