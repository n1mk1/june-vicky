# Synthetic fixture - generated by backend/scripts/make_fixtures.py. Do not edit by hand.
# Fictional company; any resemblance to a real business is coincidental.
dataset: "financials_quarterly.csv"
layout: "wide"
transpose: true
period_format: "Qn YYYY"
mappings:
  - source_column: "Line item"
    canonical_field: "period"
    unit: "quarter"
    confidence: 0.95
    note: "wide layout: the quarter headers become the period column after transposition"
  - source_column: "Subscription ARR-recognized revenue"
    canonical_field: "revenue.recurring"
    unit: "usd"
    confidence: 0.95
    note: "recognized subscription revenue for the quarter (a quarterly flow, not ARR despite the label)"
  - source_column: "Professional services"
    canonical_field: "revenue.one_time"
    unit: "usd"
    confidence: 0.95
    note: "onboarding and implementation fees"
  - source_column: "Total Revenue"
    canonical_field: "revenue.total"
    unit: "usd"
    confidence: 0.95
    note: "= Subscription + Professional services"
  - source_column: "Hosting & infrastructure"
    canonical_field: null
    unit: "usd"
    confidence: 0.95
    note: "component of Cost of revenue"
  - source_column: "Third-party data costs"
    canonical_field: null
    unit: "usd"
    confidence: 0.95
    note: "component of Cost of revenue"
  - source_column: "Cost of revenue"
    canonical_field: "cogs"
    unit: "usd"
    confidence: 0.95
    note: "= Hosting & infrastructure + Third-party data costs"
  - source_column: "Gross profit"
    canonical_field: "gross_profit"
    unit: "usd"
    confidence: 0.95
    note: "= Total Revenue - Cost of revenue"
  - source_column: "Engineering payroll"
    canonical_field: "opex.r_and_d"
    unit: "usd"
    confidence: 0.95
    note: "opex category"
  - source_column: "Go-to-market payroll"
    canonical_field: "opex.s_and_m"
    unit: "usd"
    confidence: 0.95
    note: "opex category; summed with Paid acquisition"
  - source_column: "Paid acquisition"
    canonical_field: "opex.s_and_m"
    unit: "usd"
    confidence: 0.95
    note: "opex category; summed with Go-to-market payroll"
  - source_column: "Customer support team"
    canonical_field: "opex.customer_success"
    unit: "usd"
    confidence: 0.95
    note: "opex category"
  - source_column: "Admin & office"
    canonical_field: "opex.g_and_a"
    unit: "usd"
    confidence: 0.95
    note: "opex category; summed with Legal and accounting"
  - source_column: "Legal and accounting"
    canonical_field: "opex.g_and_a"
    unit: "usd"
    confidence: 0.95
    note: "opex category; summed with Admin & office"
  - source_column: "Total opex"
    canonical_field: "opex.total"
    unit: "usd"
    confidence: 0.95
    note: "= sum of the six opex rows"
  - source_column: "EBITDA"
    canonical_field: "operating_income"
    unit: "usd"
    confidence: 0.95
    note: "no D&A line, so EBITDA is operating income; = Gross profit - Total opex"
  - source_column: "Cash at quarter end"
    canonical_field: "cash_balance"
    unit: "usd"
    confidence: 0.95
    note: "balance at quarter end"
  - source_column: "Paying customers (end of quarter)"
    canonical_field: "customers.count"
    unit: "count"
    confidence: 0.95
    note: "end-of-quarter paying logos"
  - source_column: "New logos"
    canonical_field: "customers.new"
    unit: "count"
    confidence: 0.95
    note: "logos signed in the quarter"
  - source_column: "Churned logos"
    canonical_field: "customers.churned"
    unit: "count"
    confidence: 0.95
    note: "logos lost in the quarter"
  - source_column: "Headcount"
    canonical_field: "headcount.total"
    unit: "count"
    confidence: 0.95
    note: "end-of-quarter FTEs"
tables:
  - file: "cohort_mrr.csv"
    kind: "cohorts"
    columns:
      - "signup_quarter"
      - "quarter"
      - "mrr"
    note: "mrr = average monthly recurring revenue of the cohort in that quarter; sum over cohorts x 3 = Subscription ARR-recognized revenue"
  - file: "customer_mrr.csv"
    kind: "per_customer_mrr"
    columns:
      - "customer"
      - "quarter"
      - "mrr"
    note: "latest quarter only; sums to total MRR for that quarter"
absent_fields:
  - "non_dilutive_income"
  - "net_income"
  - "depreciation"
  - "bookings"
  - "pipeline"
