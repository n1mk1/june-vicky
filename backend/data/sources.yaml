# Benchmark and reference library (seeds the `sources` table; this YAML is the source of truth).
# Seeded from Appendix F of the Catalyst Team 18 supporting pack (pp.25-27; every link there was
# checked by the organisers on 2026-10-14) plus primary benchmark sources.
#
# Fields
#   id: snake_case, cited as source_id. One entry = one citable claim; a publication with
#       several benchmarks gets several entries sharing the url.
#   claim: one sentence stating exactly what the source says (quoted where possible).
#   as_of: publication date (YYYY-MM-DD, YYYY-MM or YYYY); null when the page shows none.
#   business_model / stage / topic: filters for the benchmark picker.
#   verified: true only if the page was fetched on `checked` and its text supports the claim.
#   verification_note: what was and wasn't confirmed.
#   pack_ref: where Appendix F lists it, if it does.
#
# Rules: quote the benchmark with its publisher when used. US/portfolio data must be labelled
# as such for a non-US company. No SR&ED limit or rate figures are recorded here (none were
# verified on canada.ca).

sources:
  # ------------------------------------------------------------------ capital efficiency
  - id: sacks_burn_multiple
    publisher: David Sacks (Craft Ventures)
    title: "The Burn Multiple"
    claim: "Burn Multiple = Net Burn / Net New ARR, i.e. how much a startup burns to add each incremental dollar of ARR; the essay calls about 2x reasonable for an early-stage startup and 5x terrible."
    url: https://sacks.substack.com/p/the-burn-multiple-51a7e43cb200
    as_of: "2020-04-23"
    business_model: [recurring]
    stage: [seed, series_a, series_b_plus]
    topic: [burn_multiple]
    verified: true
    checked: "2026-10-17"
    verification_note: "Formula and the 2x / 5x remarks confirmed in the text. The rating-band table (amazing/great/good/suspect/bad) is an image and was NOT verified, so no bands are recorded."
    pack_ref: "Appendix F, p.26"
  - id: saastr_series_a_burn_multiple
    publisher: SaaStr (Jason Lemkin)
    title: "Dear SaaStr: What Are The Top 10 Metrics Series A Investors Look At?"
    claim: "\"A burn multiple of 1-2x is healthy.\""
    url: https://www.saastr.com/dear-saastr-what-are-the-top-10-metrics-series-a-investors-look-at
    as_of: null
    business_model: [recurring]
    stage: [series_a]
    topic: [burn_multiple]
    verified: true
    checked: "2026-10-17"
    verification_note: "Quote confirmed; the page shows no publication date."
    pack_ref: null
  - id: bvp_10_laws_efficiency
    publisher: Bessemer Venture Partners
    title: "10 Laws of Cloud"
    claim: "\"For growth stage startups earning less than $30 million ARR, efficient growth is defined by net new ARR over net burn\" (optimal score >1.5)."
    url: https://www.bvp.com/atlas/10-laws-of-cloud
    as_of: "2019-06-19"
    business_model: [recurring]
    stage: [series_a, series_b_plus]
    topic: [burn_multiple, efficiency]
    verified: true
    checked: "2026-10-17"
    verification_note: "Quote confirmed. This ratio is the inverse of the burn multiple (>1.5 here = burn multiple below ~0.67)."
    pack_ref: "Appendix F, p.26"
  - id: bvp_state_of_cloud_2024_efficiency
    publisher: Bessemer Venture Partners
    title: "State of the Cloud 2024"
    claim: "Vertical AI companies with at least $4M ARR showed ~400% year-over-year growth, ~65% average gross margin and a ~1.1x BVP Efficiency Ratio (Net New CARR / Net Burn)."
    url: https://www.bvp.com/atlas/state-of-the-cloud-2024
    as_of: "2024-06-20"
    business_model: [recurring]
    stage: [series_a, series_b_plus]
    topic: [efficiency, growth, gross_margin]
    verified: true
    checked: "2026-10-17"
    verification_note: "Confirmed. Cohort is Vertical AI at $4M+ ARR, not early-stage SaaS generally; use with that caveat."
    pack_ref: null

